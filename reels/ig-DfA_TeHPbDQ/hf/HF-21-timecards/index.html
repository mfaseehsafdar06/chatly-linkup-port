<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../_linkup/linkup.css">
<style>
#bgfill { position:absolute; inset:0; background:#EFEADF; }
.view { position:absolute; left:0; top:0; width:4200px; height:1080px; transform-origin: 160px 540px; }
.flat { position:absolute; left:-200px; top:-200px; width:4000px; height:1700px; background: linear-gradient(180deg,#F5F1E7,#F1ECE1); }
.flat > * { position:absolute; }
.logo { left:352px; top:272px; font-size:55px; letter-spacing:.08em; color:#1F1E1C; }
.logo i { font-style:normal; color:#E2728F; }
.sub { left:352px; top:432px; font-size:30px; color:#8B877D; }
.big { left:357px; top:492px; font-size:98px; letter-spacing:.11em; color:#1F1E1C; white-space:nowrap; }
.tc { top:722px; width:300px; height:236px; border-radius:34px; background:#FBF9F4; box-shadow:0 3px 14px rgba(60,50,30,.10), 0 0 0 1px rgba(0,0,0,.025); box-sizing:border-box; padding:34px 28px; }
.tc .nm { font-size:23px; color:#3B3933; }
.tc .tm { font-size:40px; letter-spacing:.04em; margin:12px 0 10px; color:#1F1E1C; }
.tc .ct { font-size:20px; color:#8B877D; display:flex; align-items:center; gap:6px; }
.where { left:362px; top:1060px; font-size:48px; letter-spacing:.05em; color:#1F1E1C; transform:rotate(-2deg); transform-origin:left center; }
#g2 { left:0; top:0; }
</style></head><body>
<div id="stage" class="lu"><div id="bgfill"></div>
  <div class="view" id="v1"></div><div class="view" id="v2"></div>
</div>
<template id="tpl"><div class="flat">
  <div class="logo lu-hand">LINK <i>UP!</i></div>
  <div class="sub">60 min · 7-day window · 5 people</div>
  <div class="big lu-hand">CREATOR CREW</div>
  <div class="where lu-hand">Where everyone is</div>
  <canvas class="gl" width="2600" height="1700" style="left:0;top:0"></canvas>
</div></template>
<script src="../lib/kit.js"></script>
<script src="../_linkup/vendor/d3.min.js"></script><script src="../_linkup/vendor/topojson-client.min.js"></script><script src="../_linkup/vendor/land-50m.js"></script>
<script src="../_linkup/linkup.js"></script>
<script>
// HF-21: shot 41, ref 51.46-53.08 (t=0 at 51.46). Angled screen, focus pull to sharp by 52.3, TIME sticker 51.80.
const T0 = 51.46, P = LU.PEOPLE, $ = s => document.querySelector(s), stage = $('#stage');
const ORDER = ['ying', 'fin', 'izy', 'leo', 'luke'];
const RE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B877D" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/></svg>`;
const views = [$('#v1'), $('#v2')].map(v => { v.appendChild($('#tpl').content.cloneNode(true)); const f = v.querySelector('.flat');
  ORDER.forEach((k, i) => { const p = P[k], d = document.createElement('div'); d.className = 'tc'; d.style.left = (365 + i * 345) + 'px';
    d.innerHTML = `<div class="nm">${p.name}</div><div class="tm lu-hand">${LU.timeFor(p, 13, 36)}</div><div class="ct">${k === 'ying' || k === 'fin' ? '' : RE}${p.city}</div>`; f.appendChild(d); });
  return v; });
const stk = LU.sticker(stage, 'time', [690, 144, 905, 243], 51.80 - T0, 21);
const cur = LU.cursorEl(stage);
window.ready = (async () => { await LU.loadLand('50m'); await stk.ready; await document.fonts.ready;
  views.forEach(v => { const g = v.querySelector('.gl').getContext('2d'); LU.drawGlobe(g, { cx: 1590, cy: 1650, r: 480, lon0: 20, lat0: 25 }); }); })();
// v1 = sharp near plane, v2 = blurred copy masked in towards the far (right) side: depth of field on an angled screen
window.render = t => {
  const dr = [Math.sin(t * 1.4) * 5, t * 9], s = 1 + t * 0.012;
  const tf = `translate(${dr[0]}px,${dr[1]}px) perspective(1800px) rotateY(17deg) rotateX(3deg) scale(${s})`;
  // focus pull: focal band starts on the far (right) cards and racks to the near (left) side, sharp by 52.30
  const u = LU.smooth(HF.clamp((t - 0.25) / 0.6)), fx = 1050 + (300 - 1050) * u, soft = 1 - HF.clamp((t - 0.0) / 0.85);
  views[0].style.transform = tf; views[1].style.transform = tf;
  views[1].style.filter = `blur(${2.2 + 4.3 * soft}px)`; views[1].style.zIndex = 1; // sharp band layer on top
  views[0].style.filter = 'blur(6.5px)'; views[0].style.zIndex = 0;
  const lo = Math.max(0, fx - 330 - 400 * u), hi = fx + 330;
  views[1].style.webkitMaskImage = `linear-gradient(90deg, ${u > .9 ? '#000' : 'transparent'} ${lo - 250}px, #000 ${lo}px, #000 ${hi}px, transparent ${hi + 330}px)`;
  views[1].style.filter = `blur(${2.4 * soft * soft}px)`;
  cur.set(412 + dr[0] * .5, 718 + dr[1] * .6, 'arrow', 1);
  stk.set(t);
};
</script></body></html>

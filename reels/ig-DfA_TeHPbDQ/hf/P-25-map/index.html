<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1440" height="1080"></canvas>
<script src="../lib/kit.js"></script><script src="../_props/x.js"></script><script>
// P-25 Paper world map: red marker circles New York, London, San Francisco (one close-up each, as seg1923 shots 18-19),
// whip-zoom out, then timezone stickers -5 / 0 / +5 pop on the wide map. FULL-FRAME, 72 frames (3.0 s).
// Map = seg1923/src/map2.jpg (CIA political map; map px = (hi-res px - (1000,1300)) * 0.6). Marker hand = seg1923/gen/hand_rgba.png.
// ======== CONFIG ========
const CITY={NY:[1889,1397],LON:[3193,1175],SF:[1006,1458],PK:[4470,1640]};          // map2 px
const SHOTS=[ // name, f0, f1 (exclusive), city, screen point for the city, scale, circle [rx,ry,rot,a0,dir] (screen px), draw f0..f1, marker angle, exit dir
 {n:'NY', f0:0, f1:15,c:'NY', sp:[690,610],s:.80,el:[150,118,.05,-2.0,-1],d:[1,10],ang:2.0,ex:[.45,1]},
 {n:'LON',f0:15,f1:30,c:'LON',sp:[700,570],s:.92,el:[190,165,-.25,-1.5,1],d:[16,25],ang:2.88,ex:[-1,.25]},
 {n:'SF', f0:30,f1:45,c:'SF', sp:[640,560],s:.80,el:[165,125,-.06,3.14,1],d:[31,40],ang:3.0,ex:[-1,.12]}];
const ZOOM={f0:45,f1:48};                                // whip-zoom frames (SF close-up -> wide)
const WIDE={f0:48,center:[2850,1430],s:.33};            // wide framing (map px at screen centre, scale)
const STICK=[ // timezone stickers on the wide map: cutout, anchor city, offset from the city (screen px), width, rot, pop frame
 {src:'F-01_03',city:'NY', off:[70,160], w:230,rot:-8,on:51},
 {src:'F-01_04',city:'LON',off:[40,-170],w:175,rot:5, on:55},
 {src:'F-01_05_v1122',city:'SF', off:[95,165], w:200,rot:-4,on:59}];
const INK=23;                                            // marker line width (screen px at close-up scale)
// ========================
const W=1440,H=1080,FPS=24,P=window.PARAMS||{};
const g=document.getElementById('c').getContext('2d');const A=document.createElement('canvas');A.width=W;A.height=H;const AX=A.getContext('2d');
let MAP,HAND,IM;const HTIP={x:1,y:619},HAX=-10.92*Math.PI/180;
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const cam=(mp,sx,sy,s)=>({cx:mp[0]-(sx-W/2)/s,cy:mp[1]-(sy-H/2)/s,s});
SHOTS.forEach(S=>{S.cam=cam(CITY[S.c],S.sp[0],S.sp[1],S.s);
 const R=HF.rng(S.f0+7),ph=R()*6,ph2=R()*6,[rx,ry,rot,a0,dir]=S.el,c=CITY[S.c],pts=[];
 for(let i=0;i<=120;i++){const u=i/120,a=a0+dir*u*1.07*Math.PI*2;const k=1+.05*Math.sin(2*a+ph)+.03*Math.sin(3*a+ph2)-.06*u*(u>.85?1:0);
  const x=Math.cos(a)*rx/S.s*k,y=Math.sin(a)*ry/S.s*k;pts.push([c[0]+x*Math.cos(rot)-y*Math.sin(rot),c[1]+x*Math.sin(rot)+y*Math.cos(rot)]);}
 S.pts=pts;S.L=[0];for(let i=1;i<pts.length;i++)S.L.push(S.L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));});
const WCAM={cx:WIDE.center[0],cy:WIDE.center[1],s:WIDE.s};
function partial(S,pr){const tot=S.L[S.L.length-1]*pr,o=[S.pts[0]];for(let i=1;i<S.pts.length;i++){if(S.L[i]<=tot)o.push(S.pts[i]);else{const a=S.pts[i-1],b=S.pts[i],u=(tot-S.L[i-1])/(S.L[i]-S.L[i-1]);o.push([lerp(a[0],b[0],u),lerp(a[1],b[1],u)]);break;}}return o;}
const prog=(S,t)=>clamp((t*FPS-S.d[0])/(S.d[1]-S.d[0]));
function drift(i,t){return[Math.sin(t*2.1+i)*4+Math.sin(t*5.3+i*2)*1.5,Math.cos(t*1.7+i)*3+Math.sin(t*4.1+i)*1.2];}
function camAt(t){const f=t*FPS;
 if(f>=WIDE.f0){const d=drift(9,t);return{cx:WCAM.cx-d[0]/WCAM.s,cy:WCAM.cy-d[1]/WCAM.s,s:WCAM.s*(1+(f-WIDE.f0)/FPS*.01)};}
 if(f>=ZOOM.f0){const q=clamp((f-ZOOM.f0)/(ZOOM.f1-ZOOM.f0));const u=q*q*(3-2*q);const a=SHOTS[2].cam,b=WCAM;
  const fx=(a.s*a.cx-b.s*b.cx)/(a.s-b.s),fy=(a.s*a.cy-b.s*b.cy)/(a.s-b.s);const sc=Math.exp(lerp(Math.log(a.s),Math.log(b.s),u));return{cx:fx-(fx-a.cx)*a.s/sc,cy:fy-(fy-a.cy)*a.s/sc,s:sc};}
 const i=SHOTS.findIndex(S=>f>=S.f0&&f<S.f1),S=SHOTS[i],b=S.cam,d=drift(i,t);return{cx:b.cx-d[0]/b.s,cy:b.cy-d[1]/b.s,s:b.s*(1+(f-S.f0)/FPS*.012)};}
const toS=(c,p)=>[(p[0]-c.cx)*c.s+W/2,(p[1]-c.cy)*c.s+H/2];
function drawMarks(G,c,t){G.save();G.lineCap='round';G.lineJoin='round';
 SHOTS.forEach((S,mi)=>{const pr=prog(S,t);if(pr<=0)return;const pts=partial(S,pr).map(p=>toS(c,p));const w=INK/S.s*c.s;
  const path=()=>{G.beginPath();pts.forEach((p,i)=>i?G.lineTo(p[0],p[1]):G.moveTo(p[0],p[1]));};
  G.filter='blur(.6px)';G.strokeStyle='rgba(176,14,30,.95)';G.lineWidth=w*1.08;path();G.stroke();G.strokeStyle='rgba(222,34,46,.96)';G.lineWidth=w*.74;path();G.stroke();
  G.filter='blur(1.4px)';G.globalCompositeOperation='screen';G.strokeStyle='rgba(120,40,40,.35)';G.lineWidth=w*.14;G.setLineDash([w*1.6,w*.9,w*.5,w*1.2]);G.lineDashOffset=mi*37;path();G.stroke();G.setLineDash([]);G.globalCompositeOperation='source-over';});
 G.restore();G.filter='none';}
function drawMarker(G,tx,ty,ang){G.save();G.translate(tx,ty);G.rotate(ang);if(Math.cos(ang)<0)G.scale(1,-1);G.scale(.62,1.4);G.rotate(-HAX);G.filter='blur(3px)';G.drawImage(HAND,-HTIP.x+6,-HTIP.y);G.restore();G.filter='none';}
function marker(c,t){const f=t*FPS,S=SHOTS.find(S=>f>=S.f0&&f<S.f1);if(!S)return null;const pr=prog(S,t);const pts=partial(S,Math.max(pr,.001));let [x,y]=toS(c,pts[pts.length-1]);
 const exT=(S.d[1]+.5)/FPS;if(t>exT){const u=(t-exT)*FPS;x+=S.ex[0]*u*u*95;y+=S.ex[1]*u*u*95;}return{x,y,ang:S.ang};}
function scene(G,t){const c=camAt(t);G.setTransform(1,0,0,1,0,0);G.fillStyle='#dff1f6';G.fillRect(0,0,W,H);
 G.save();G.setTransform(c.s,0,0,c.s,W/2-c.cx*c.s,H/2-c.cy*c.s);G.drawImage(MAP,0,0);G.restore();drawMarks(G,c,t);const m=marker(c,t);if(m)drawMarker(G,m.x,m.y,m.ang);return c;}
function stickers(G,t){const f=Math.round(t*FPS);if(f<WIDE.f0)return;const c=camAt(t);
 STICK.forEach((k,i)=>{if(f<k.on)return;const d=f-k.on,sc=d<1?1.07:d<2?1.025:1;const [x,y]=toS(c,CITY[k.city]);const J=HF.jitter(t,i+3,.8,.15);
  X.draw(G,IM['s'+i],{cx:x+k.off[0]+J.dx,cy:y+k.off[1]+J.dy,w:k.w,rot:k.rot+J.rot*57.3,scale:sc,inset:[.004,.004,.004,.012],shadow:{op:.32,blur:9,dx:2,dy:5}});});}
window.render=t=>{const f=Math.round(t*FPS);const zoom=f>=ZOOM.f0&&f<ZOOM.f1;const n=zoom?16:(P.sub||6),sh=zoom?.6:.5;
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
 for(let i=0;i<n;i++){let ts=t+(i/n-.5)*sh/FPS;const sf=SHOTS.find(S=>f>=S.f0&&f<S.f1);if(sf)ts=clamp(ts,sf.f0/FPS,(sf.f1-.001)/FPS);else if(f>=WIDE.f0)ts=Math.max(ts,WIDE.f0/FPS);
  AX.setTransform(1,0,0,1,0,0);scene(AX,ts);g.globalAlpha=1/(i+1);g.drawImage(A,0,0);}
 g.globalAlpha=1;stickers(g,t);};
window.ready=(async()=>{MAP=await HF.loadImg('../../seg1923/src/map2.jpg');HAND=await HF.loadImg('../../seg1923/gen/hand_rgba.png');
 const m={};STICK.forEach((k,i)=>m['s'+i]='../../assets/cut/'+k.src+'.png');IM=await X.load(m);})();
</script></body></html>

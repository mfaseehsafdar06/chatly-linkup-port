<script>
// HF-23: shot 43, ref 56.50-57.96 (t=0 at 56.50). Green selected, click Yellow at 57.00, drift toward Red.
const T0 = 56.50, $ = s => document.querySelector(s), cur = LU.cursorEl($('#stage'));
const CK = [[56.5, [450, 384]], [56.7, [450, 368]], [56.9, [455, 346]], [57.0, [452, 352]], [57.2, [451, 356]], [57.4, [455, 352]], [57.5, [508, 462]], [57.6, [519, 472]], [57.7, [600, 386]], [57.8, [622, 371]], [57.96, [632, 368]]]
  .map(([a, [x, y]]) => [a - T0, [x * 1.5, y * 1.5]]);
window.ready = (async () => { await document.fonts.ready; await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); })();
window.render = t => {
  const sel = T0 + t >= 57.0 - 1e-6 ? 1 : 0;
  for (let i = 0; i < 3; i++) $('#o' + i).classList.toggle('sel', i === sel);
  const press = t >= 0.46 && t < 0.54; $('#o1').style.transform = press ? 'scale(.985)' : '';
  $('#cam').style.transform = `translate(${Math.sin(t * 1.7) * 3}px,${Math.cos(t * 1.3) * 2}px)`;
  const [x, y] = LU.lerpKeys(CK, t, LU.smooth); cur.set(x, y, "arrow", 1.12);
};
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Hand;src:url(../../faseeh/edit/fonts/CoveredByYourGrace.ttf)}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1440" height="1080"></canvas>
<script src="../lib/kit.js"></script><script src="../_props/x.js"></script><script>
// P-31 "3 posts a day, each needing hooks, captions and hashtags. So that's 360 posts a week."  FULL-FRAME 5.9 s (VO 28.10-34.00).
// Paper board: 3 big post notes + label stickers, then the board floods with tiny post notes (3 -> 360), then '=360' slams + 'POSTS A WEEK'.
const T={three:0.0,hooks:1.76,caps:2.38,tags:3.12,floodA:3.30,floodB:4.42,n360:4.46,week:4.78};
const W=1440,H=1080,FPS=24,g=document.getElementById('c').getContext('2d');let IM,ST={},PAPER;
const PALC=[[250,226,92],[244,150,190],[90,180,236],[96,200,140],[245,245,240]];
function sticker(blank,txt,h,{pad=34,size=1}={}){const c=document.createElement('canvas');const q=c.getContext('2d');
 q.font=`${Math.round(h*.78*size)}px Hand`;const tw=q.measureText(txt).width;c.width=Math.round(tw+pad*2);c.height=h;
 q.drawImage(blank,0,0,c.width,c.height);q.font=`${Math.round(h*.78*size)}px Hand`;q.textBaseline='middle';q.fillStyle='#24262c';
 q.save();q.translate(pad,h*.54);q.scale(1,1.18);q.filter='blur(.5px)';q.fillText(txt,0,0);q.lineWidth=2.2;q.strokeStyle='#24262c';q.strokeText(txt,0,0);q.restore();return c}
// tiny notes: 24x15 grid, random fill order
const R=HF.rng(77),NOTES=[];for(let r=0;r<15;r++)for(let c=0;c<24;c++)NOTES.push({x:30+c*58.5+(R()-.5)*26,y:40+r*68+(R()-.5)*26,rot:(R()-.5)*26,col:PALC[(R()*4)|0],s:44+R()*14,k:R()});
NOTES.sort((a,b)=>a.k-b.k);
const BIG=[{x:410,y:560,rot:-6,col:PALC[0]},{x:720,y:545,rot:3,col:PALC[1]},{x:1030,y:565,rot:-2,col:PALC[2]}];
function note(q,n,s,sc=1,seed=1){q.save();q.translate(n.x,n.y);q.rotate(n.rot*Math.PI/180);q.scale(sc,sc);
 q.shadowColor='rgba(30,25,10,.28)';q.shadowBlur=s*.12;q.shadowOffsetY=s*.06;q.fillStyle=`rgb(${n.col})`;q.fillRect(-s/2,-s/2,s,s);q.shadowColor='transparent';
 q.fillStyle='rgba(0,0,0,.05)';q.fillRect(-s/2,-s/2,s,s*.12);
 const r=HF.rng(seed);q.strokeStyle='rgba(36,38,44,.85)';q.lineCap='round';q.lineWidth=Math.max(1.5,s*.05);
 for(let i=0;i<3;i++){const y=-s*.22+i*s*.2;q.beginPath();q.moveTo(-s*.32,y);for(let k=1;k<=6;k++)q.lineTo(-s*.32+k*s*(.1+r()*.02)*(i==2?.7:1),y+(r()-.5)*s*.05);q.stroke()}
 q.restore()}
function popS(t,t0,f=3){const d=(t-t0)*FPS;if(d<0)return 0;return d<1?1.18:d<2?1.06:d<f?1.02:1}
window.render=t=>{const f=Math.round(t*FPS);g.setTransform(1,0,0,1,0,0);
 // camera: slow push + hand drift, shake on the 360 slam
 let sc=1+t*.012,dx=Math.sin(t*2.1)*4+Math.sin(t*5.3)*1.5,dy=Math.cos(t*1.7)*3;const ds=(t-T.n360)*FPS;if(ds>=0&&ds<5){const a=(5-ds)*2.4;dx+=(ds%2?1:-1)*a;dy+=(ds%2?-1:1)*a*.6}
 g.drawImage(PAPER,0,0);g.setTransform(sc,0,0,sc,W/2*(1-sc)+dx,H/2*(1-sc)+dy);
 // big three
 BIG.forEach((n,i)=>{const s=popS(t,T.three+i*.12);if(s)note(g,n,230,s,i+5)});
 // labels
 [['hooks',T.hooks,0,'pink'],['caps',T.caps,1,'blue'],['tags',T.tags,2,'green']].forEach(([k,t0,i,c])=>{const s=popS(t,t0);if(!s)return;const n=BIG[i],J=HF.jitter(t,i+9,.8,.2);
  X.draw(g,ST[k],{cx:n.x+J.dx,cy:n.y+[150,175,150][i]+J.dy,w:ST[k].width*.5,rot:[-5,4,-3][i],scale:s,shadow:{op:.3,blur:8,dx:2,dy:5}})});
 // headline sticker
 {const s=popS(t,T.three);if(s){const J=HF.jitter(t,3,.8,.2);X.draw(g,ST.day,{cx:720+J.dx,cy:250+J.dy,w:ST.day.width*.78,rot:-2,scale:s,shadow:{op:.3,blur:9,dx:2,dy:5}})}}
 // flood
 if(t>=T.floodA){const u=HF.clamp((t-T.floodA)/(T.floodB-T.floodA));const n=Math.round(360*u*u);for(let i=0;i<n;i++){const N=NOTES[i];const born=T.floodA+Math.sqrt(i/360)*(T.floodB-T.floodA);note(g,N,N.s,popS(t,born,2)||1,i)}}
 // 360 slam
 if(t>=T.n360){g.setTransform(1,0,0,1,dx*.5,dy*.5);g.fillStyle=`rgba(20,18,14,${Math.min(.35,(t-T.n360)*3)})`;g.fillRect(0,0,W,H);
  const d=(t-T.n360)*FPS,s=d<1?1.45:d<2?1.12:d<3?1.03:1;const J=HF.jitter(t,21,.8,.2);
  X.draw(g,IM.n360,{cx:720+J.dx,cy:470+J.dy,w:820,rot:-3,scale:s,shadow:{op:.45,blur:16,dx:3,dy:9}});
  const s2=popS(t,T.week);if(s2){const J2=HF.jitter(t,22,.8,.2);X.draw(g,ST.week,{cx:740+J2.dx,cy:735+J2.dy,w:ST.week.width*.8,rot:2,scale:s2,shadow:{op:.4,blur:12,dx:2,dy:7}})}}
};
window.ready=(async()=>{await document.fonts.load('80px Hand');
 IM=await X.load({n360:'../../assets/cut/F-01_07_v1122.png',y:'../../faseeh/edit/stk/blank-yellow.png',p:'../../faseeh/edit/stk/blank-pink.png',b:'../../faseeh/edit/stk/blank-blue.png',gr:'../../faseeh/edit/stk/blank-green.png',w:'../../faseeh/edit/stk/blank-blue.png'});
 ST.day=sticker(IM.y,'3 POSTS A DAY',190);ST.hooks=sticker(IM.p,'HOOKS',150);ST.caps=sticker(IM.b,'CAPTIONS',150);ST.tags=sticker(IM.gr,'#HASHTAGS',150);ST.week=sticker(IM.w,'POSTS A WEEK',170);
 PAPER=document.createElement('canvas');PAPER.width=W;PAPER.height=H;X.scanPaper(PAPER.getContext('2d'),31,[247,246,241],60);return true})();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1440" height="1080"></canvas>
<script src="../lib/kit.js"></script><script src="../_props/x.js"></script><script>
// P-29 Prompt cards, FULL-FRAME top-down desk shot, 72 frames (3.0 s), stepped on 2s (stop-motion).
//  (a) frames 0..29  : the empty-blanks card F-05_00 is slid in from the right by the pinch hand, hand lets go and leaves
//  (b) frames 30..71 : filled cards F-05_01..03 land on top of the stack one every FLIP_EVERY frames (fast flip)
// The edit can use the whole clip or the out/P-29a / P-29b splits.
// ======== CONFIG ========
const CARD_W=1060, CENTER=[690,545];
const A={slide:[0,10], from:1150, hold:10, handOut:[12,18], rot:-2};       // slide frames, start offset (px to the right), hand exit frames
const FLIPS=[{src:'F-05_01',on:30,dx:-8,dy:6,rot:1.2},{src:'F-05_02',on:40,dx:10,dy:-4,rot:-2.6},{src:'F-05_03',on:50,dx:-4,dy:10,rot:.8}];
const HAND={w:820,rot:-6,pinch:[20,212],inset:28};                       // pinch hand H1: drawn width, rotation, pinch point in H1 px, pinch depth inside card edge
const DESK={base:[201,178,142],grain:.07};                               // light oak desk
// ========================
const W=1440,H=1080;const g=document.getElementById('c').getContext('2d');let IM,DK;
window.ready=(async()=>{const m={H1:'../_props/hands/H1.png',C0:'../../assets/cut/F-05_00.png'};FLIPS.forEach((f,i)=>m['C'+(i+1)]='../../assets/cut/'+f.src+'.png');IM=await X.load(m);
 DK=document.createElement('canvas');DK.width=W;DK.height=H;const q=DK.getContext('2d');q.fillStyle=`rgb(${DESK.base})`;q.fillRect(0,0,W,H);const R=HF.rng(21);
 for(let i=0;i<260;i++){const y=R()*H,l=500+R()*1200,x=R()*W-400;q.strokeStyle=`rgba(${R()<.6?'110,78,40':'240,220,185'},${R()*DESK.grain})`;q.lineWidth=1.5+R()*5;q.beginPath();q.moveTo(x,y);q.bezierCurveTo(x+l*.3,y+(R()-.5)*6,x+l*.7,y+(R()-.5)*6,x+l,y+(R()-.5)*4);q.stroke();}
 for(let i=0;i<2500;i++){q.fillStyle=`rgba(0,0,0,${R()*.04})`;q.fillRect(R()*W,R()*H,1+R()*2,1);}
 const gr=q.createRadialGradient(W*.35,H*.25,100,W*.5,H*.5,W*.85);gr.addColorStop(0,'rgba(255,252,240,.18)');gr.addColorStop(1,'rgba(40,30,10,.18)');q.fillStyle=gr;q.fillRect(0,0,W,H);})();
function card(G,k,x,y,rot){const img=IM[k];X.draw(G,img,{cx:x,cy:y,w:CARD_W,rot,inset:[.002,.004,.004,.02],shadow:{op:.26,blur:12,dx:3,dy:7}});}
window.render=t=>{const f=Math.round(t*24),s=Math.floor(f/2)*2;g.setTransform(1,0,0,1,0,0);g.drawImage(DK,0,0);const J=HF.jitter(t,2,1.4,.1);g.translate(J.dx,J.dy);
 // (a) blank card
 const u=Math.min(1,Math.max(0,(s-A.slide[0])/(A.slide[1]-A.slide[0])));const e=1-Math.pow(1-u,2.4);const ox=A.from*(1-e);
 const cx=CENTER[0]+ox,cy=CENTER[1]+(1-e)*30;card(g,'C0',cx,cy,A.rot+(1-e)*6);
 // pinch hand on the card's right edge
 if(s<A.handOut[1]){const ch=CARD_W*IM.C0.height/IM.C0.width;const a=(A.rot+(1-e)*6)*Math.PI/180;const ex=CARD_W/2-HAND.inset;let hx=cx+ex*Math.cos(a),hy=cy+ex*Math.sin(a);
  let blur=0;if(s>=A.handOut[0]){const v=(s-A.handOut[0])/(A.handOut[1]-A.handOut[0]);hx+=v*v*900;hy+=v*v*260;blur=v>0?18:0;}
  const sc=HAND.w/IM.H1.width;const dh=(G,dx,dy)=>{G.save();G.translate(hx+dx,hy+dy);G.rotate(a+HAND.rot*Math.PI/180);G.scale(sc,sc);G.shadowColor='rgba(0,0,0,.3)';G.shadowBlur=24;G.shadowOffsetY=14;G.drawImage(IM.H1,-HAND.pinch[0],-HAND.pinch[1]);G.restore();};
  if(u<1&&s>A.slide[0]){blur=26*(1-u);}if(blur)X.mblur(g,[blur,blur*.25],8,dh);else dh(g,0,0);}
 // (b) flips (stop-motion: each card lands in 2 steps)
 FLIPS.forEach((F,i)=>{if(s<F.on-2)return;const land=s>=F.on;const x=CENTER[0]+F.dx+(land?0:70),y=CENTER[1]+F.dy+(land?0:-50);const r=F.rot+(land?0:5);
  if(land)card(g,'C'+(i+1),x,y,r);else X.mblur(g,[-40,30],8,(G,dx,dy)=>card(G,'C'+(i+1),x+dx,y+dy,r));});};
</script></body></html>
